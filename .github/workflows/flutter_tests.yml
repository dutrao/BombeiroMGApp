name: Flutter CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Instalar dependências Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev

      - name: Baixar dependências
        run: flutter pub get

      - name: Rodar test integração
        run: flutter test integration_test -d linux